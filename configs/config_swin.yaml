data:
  path: $HOME/datasets/POP909_images_basic  # adjust path as needed
  image_size: 128
  in_channels: 1

model:
  encoder: swin           # 'vit' or 'swin'
  patch_h: 4
  patch_w: 4
  embed_dim: 8            # doubles each stage: 8 → 16 → 32 → 64 → 128 → 256
  depths: [2, 2, 2, 6, 2, 1]
  num_heads: [2, 2, 2, 4, 8, 16]
  window_size: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  dec_depths: [4, 4, 4, 6, 2, 1]
  dec_num_heads: [2, 2, 2, 4, 8, 16]

training:
  batch_size: 300         # encoder batch size
  lr: 5e-4                # peak lr for CosineAnnealingWarmRestarts; halved to reduce restart spikes
  epochs: 100
  lambd: 0.2              # lejepa attraction-vs-sigreg weight
  max_shift_x: 12         
  max_shift_y: 12
  #init_shift_x: 1        # enable curriculum learning, starting with this value
  #init_shift_y: 1
  lambda_mae: 0.0         # strength of mae loss term
  mask_ratio: 0.5         # between levels, ma
  empty_mask_ratio: 0.05  # fraction of mask_ratio applied to empty patches
  ema_eta: 1e-5
  ema_update_every: 1
  lr_warmup_epochs: 24   # flat+cosine-tail schedule: warmup epochs
  lr_tail_epochs: 80     # flat+cosine-tail schedule: cosine decay epochs at end
  lambda_mep:  1.0        # masked embedding predictor
  lambda_visible: 1.0     # for handling unbalanced classes, 1 = no effect
  lambda_anchor: 0.0      # L2 loss on empty patch embeddings
  lambda_fact: 0.0        # factorization loss (tabled; see program.md)
  lambda_sim: 1.0         # attraction loss weight
  lambda_sim_curriculum_epochs: 0  # no curriculum; lambda_sim stays fixed
  delta_mep: false               # if true, MEP predicts shifted image embeddings conditioned on deltas
  n_skip_finest_levels: 2       # skip LeJEPA on this many finest levels (default 1 = skip L5 only)

  dec_batch_size: 360     # decoder-training batch size
  dec_epochs: 100 # 500
  dec_lr: 2e-3
  pos_weight: 1.0
  gan_warmup: 100000      # number of epochs before adversarial training starts
  enc_ft_lr: -1           # lr for fine-tuning enc via end-to-end training w/ decoder
  emb_mask_ratio: 0.4     # finest-level patch mask ratio for robustness training (0=disabled, L0 never masked)
  emb_mask_level_fac: 1.25  # ratio divisor per coarser level (mirrors MEP; finer levels masked more)

  pca_aug: true           # apply PCA roundtrip to embeddings during decoder training (fixes train/inference distribution shift)
  pca_dir: $HOME/datasets/POP909_pca_exp26  # dir containing pca_L{i}_n20.pkl files
  pca_aug_levels: 6       # apply PCA to this many levels (skips levels without a pkl file)
  pca_aug_prob: 1.0       # fraction of training batches that get PCA roundtrip (1.0 = always, matches inference)
  pca_fine_levels: [4, 5]           # fine levels with separate n_components
  pca_fine_n_components: [5, 3]     # L4=5 (90.1%), L5=3 (95.5%)
  dec_init_ckpt: null     # optional: warm-start decoder weights from this checkpoint


preencode:
  output_dir: $HOME/datasets/POP909_encoded_exp26
  num_passes: 3           # number of passes through the dataset

flow:
  embedding_glob: $HOME/datasets/POP909_pca_exp26/train_chunk*_pca20.pt
  checkpoint_dir: checkpoints/flow
  h_dim: 512
  n_layers: 4
  n_epochs: 100000
  lr: 1e-3
  batch_size: 4096
  steps_per_epoch: 1000
  warp_s: 0.5
  save_every: 10
  eval_every: 10
  viz_every: 20               # how often to log histograms + scatter plots to W&B (must be multiple of eval_every)
  lr_restart_epochs: 500      # T_0 (first cycle length) for warm-restart schedule; periods double (T_mult=2)
  lr_warmup_frac: 0.15        # fraction of each cycle spent on linear warmup to peak lr
  source_df: [null, null, null, 3.0, 3.0, 3.0]  # per-level: null=Gaussian (coarse), 3.0=Student-t (fine)
  source_scales: [8.0, 4.0, 2.0, 0.5]  # per-level scale factors; len sets n_levels to model (L0-L3 only; L4/L5 too small for PCA)
  repair_every: 1             # mini-batch OT re-pairing every N batches (0=disabled)
  n_repair_projections: 1     # random projections per ann_repair call
  repair_chunk_size: null     # chunk size for ann_repair (null=full batch)
  ema_eta: 0.9                # EMA decay rate (updated every batch)
  ema_start_epoch: 0          # epoch at which eval/sampling switches to EMA model (0 = always use EMA)
  self_condition: false       # if true, 50% of batches use self-conditioning (predict x1 first, detach, re-feed)
  model_type: per_level       # 'per_level' (PerLevelFlowModel) or 'cross_level' (CrossLevelFlowModel w/ attention)
  n_attn_layers: 2            # cross_level only: transformer encoder layers for cross-level attention
  n_heads: 8                  # cross_level only: attention heads (h_dim must be divisible by n_heads)
  t_dim: 64                   # sinusoidal time embedding dim (replaces bare scalar t in all model types)
  
flow2:
  pca_dir: $HOME/datasets/POP909_pca_exp26         # dir with *_pca20.pt (coarse L0-L3)
  encoded_dir: $HOME/datasets/POP909_encoded_exp26 # dir with train_chunk*.pt (fine L4/L5)
  coarse_ckpt: $HOME/runs/midi-rae/flow15_cross_mw6I5r/checkpoints/CrossLevelFlowModel_flow_CrossLevelFlowModel_best.pt
  checkpoint_dir: checkpoints/flow2
  h_dim: 256
  n_layers: 4
  n_attn_layers: 2
  n_heads: 8
  t_dim: 64
  n_epochs: 100000
  lr: 1e-3
  batch_size: 4096
  steps_per_epoch: 1000
  save_every: 10
  eval_every: 10
  lr_restart_epochs: 500
  lr_warmup_frac: 0.15
  ema_eta: 0.97
  ema_start_epoch: 0
  warp_s: 0.5
  fine_source_scales: [1.0, 1.0]  # scale factors for L4, L5
  fine_pca_dir: $HOME/datasets/POP909_encoded_exp26_pca
  fine_n_components: [5, 3]   # L4=5 (90.1%), L5=3 (95.5%)

fitpca:
  # encoded_dir and output_dir default to cfg.preencode.output_dir and encoded_dir+'_pca'
  levels: [4, 5]          # only process fine levels (coarse pca20 files already exist)
  fine_levels: [4, 5]
  fine_n_components: [5, 3]   # L4: 5 components (90.1%); L5: 3 components (95.5%)

wandb:
  project: ar-mep-swin-midi-rae
  flow_project: midi-rae-flow

encoder_ckpt: $HOME/runs/midi-rae/exp26_z1olvN/checkpoints/SwinEncoder_exp26_z1olvN_best.pt # for decoder usage

generate:
  pca_dir: $HOME/datasets/POP909_pca_exp26
  flow_ckpt: $HOME/runs/midi-rae/flow15_cross_mw6I5r/checkpoints/CrossLevelFlowModel_flow_CrossLevelFlowModel_best.pt
  flow_model_type: cross_level
  hmep_ckpt: $HOME/runs/midi-rae/lecun_hmep4_m9BX54/checkpoints/SwinMaskedEmbeddingPredictor_lecun_hmep4_m9BX54_best.pt
  hmep_n_summaries: [1, 2, 4, 8, 32, 64]
  decoder_ckpt: $HOME/runs/midi-rae/dec26_2JIbRt/checkpoints/SwinDecoder_dec26_2JIbRt_best.pt
  n_samples: 64
  n_steps: 100
  output_dir: outputs/generate
  use_real: false   # if true, skip flow model and use real PCA embeddings (sanity check)


tag: ???  # required run tag, will get prepended to wandb run name

