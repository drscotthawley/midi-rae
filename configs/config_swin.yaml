data:
  path: /home/shawley/datasets/POP909_images_basic  # adjust path as needed
  image_size: 128
  in_channels: 1

model:
  encoder: swin           # 'vit' or 'swin'
  patch_h: 4
  patch_w: 4
  embed_dim: 8            # doubles each stage: 8 → 16 → 32 → 64 → 128 → 256
  depths: [2, 2, 2, 6, 2, 1]
  num_heads: [2, 2, 2, 4, 8, 16]
  window_size: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  dec_depths: [4, 4, 4, 6, 2, 1]
  dec_num_heads: [2, 2, 2, 4, 8, 16]

training:
  batch_size: 300         # encoder batch size
  lr: 1e-3                # used to be 2e-4 but then we removed gradients from z1
  epochs: 25
  lambd: 0.3              # lejepa attraction-vs-sigreg weight
  max_shift_x: 12         
  max_shift_y: 12
  #init_shift_x: 1        # enable curriculum learning, starting with this value
  #init_shift_y: 1
  lambda_mae: 0.0         # strength of mae loss term
  mask_ratio: 0.5         # between levels, ma
  empty_mask_ratio: 0.05  # fraction of mask_ratio applied to empty patches
  ema_eta: 1e-5
  ema_update_every: 1
  lr_warmup_epochs: 3    # flat+cosine-tail schedule: warmup epochs
  lr_tail_epochs: 10     # flat+cosine-tail schedule: cosine decay epochs at end
  lambda_mep:  1.0        # masked embedding predictor
  lambda_visible: 1.0     # for handling unbalanced classes, 1 = no effect
  lambda_anchor: 0.0      # L2 loss on empty patch embeddings
  lambda_fact: 0.0        # factorization loss

  dec_batch_size: 360     # decoder-training batch size
  dec_epochs: 10000 # 500
  dec_lr: 2e-3
  pos_weight: 2.5
  gan_warmup: 100000      # number of epochs before adversarial training starts
  enc_ft_lr: -1           # lr for fine-tuning enc via end-to-end training w/ decoder


preencode:
  output_dir: /home/shawley/datasets/POP909_encoded
  num_passes: 10          # number of passes through the dataset

wandb:
  project: mep-swin-midi-rae

encoder_ckpt: checkpoints/SwinEncoder_MoreMEP_best.pt # for decoder usage


tag: ???  # required run tag, will get prepended to wandb run name

