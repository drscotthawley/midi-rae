defaults:
  - config_swin
  - _self_

flow_stage: pixel

flow:
  mode: pixel

flow_pixel:
  data_dir: $HOME/datasets/POP909_images_basic
  n_epochs: 500
  batch_size: 32
  lr: 1e-4
  grad_clip: 1.0
  sigma: 0.0
  fm_type: otcfm
  ema_eta: 0.9999
  lr_warmup_epochs: 20
  save_every: 50
  viz_every: 10
  eval_every: 10
  n_gen: 64
  n_ode_steps: 100
  num_workers: 4
  # UNet architecture: 4 downsamplings 128->64->32->16->8; attention at 16px
  num_channel: 128
  channel_mult: [1, 2, 4, 4]
  num_heads: 4
  num_head_channels: 64
  attention_resolutions: "16"
  dropout: 0.1
  num_res_blocks: 2
  checkpoint: ""
