# DINOv2-B frozen encoder + ViTDecoder reconstruction (RAE Stage 1 sanity check)
# DINOv2Dataset crops 128→126px (9×9 grid of 14px patches), 81 patch tokens + 1 CLS at 768-dim.

defaults:
  - config_swin_e2e   # no SSL losses, clean reconstruction; override model below

model:
  encoder: dinov2
  dinov2_model: facebook/dinov2-base  # 768-dim, patch_size=14
  patch_size: 14      # for ViTDecoder Unpatchify
  dim: 768            # DINOv2-B embedding dim (same for CLS and patch tokens)
  dec_depth: 8        # ViTDecoder transformer depth
  dec_heads: 16       # 768 / 16 = 48 per head

data:
  image_size: 126     # 9×14 = 126; DINOv2Dataset crops 128→126
  in_channels: 1      # decoder outputs 1-channel piano roll

training:
  enc_ft_lr: 0        # DINOv2 is always frozen
  emb_noise_max: 0.05  # latent noise during decoder training (flow compatibility)
  label_smooth: 0.05   # prevent BCE logit explosion spikes
  dec_lr: 5e-4
  dec_epochs: 100
  dec_batch_size: 384
  batch_size: 384
  num_workers: [8, 4]

preencoded: false
encoder_ckpt: ~

wandb:
  project: midi-rae-dino
  flow_project: midi-rae-dino-flow

tag: ???
