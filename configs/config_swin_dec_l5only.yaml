data:
  path: $HOME/datasets/POP909_images_basic
  image_size: 128
  in_channels: 1

model:
  encoder: swin
  patch_h: 4
  patch_w: 4
  embed_dim: 8            # doubles each stage: 8 → 16 → 32 → 64 → 128 → 256
  depths: [2, 2, 2, 6, 2, 1]
  num_heads: [2, 2, 2, 4, 8, 16]
  window_size: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  dec_depths: [4, 4, 4, 6, 2, 1]
  dec_num_heads: [2, 2, 2, 4, 8, 16]

training:
  batch_size: 300
  lr: 5e-4
  epochs: 100
  lambd: 0.2
  max_shift_x: 12
  max_shift_y: 12
  lambda_mae: 0.0
  mask_ratio: 0.5
  empty_mask_ratio: 0.05
  ema_eta: 1e-5
  ema_update_every: 1
  lr_warmup_epochs: 24
  lr_tail_epochs: 80
  lambda_mep: 1.0
  lambda_visible: 1.0
  lambda_anchor: 0.0
  lambda_fact: 0.0
  lambda_sim: 1.0
  lambda_sim_curriculum_epochs: 0
  delta_mep: false
  n_skip_finest_levels: 2

  dec_batch_size: 360
  dec_epochs: 100
  dec_lr: 5e-4             # lower lr for finetune (was 2e-3 for full training)
  pos_weight: 2.0
  gan_warmup: 100000
  enc_ft_lr: -1
  emb_mask_ratio: 0.05     # light patch masking within L5 only
  emb_mask_level_fac: 1.0  # flat — only L5 is unmasked so no gradient needed

  # L5-only finetune: mask L0-L4 with learned mask tokens
  mask_levels: [0, 1, 2, 3, 4]

  pca_aug: true
  pca_dir: $HOME/datasets/POP909_pca_exp26
  pca_aug_levels: 6
  pca_aug_prob: 0.9
  pca_aug_noise_std: 0.05

  # Start from dec38 best checkpoint
  dec_init_ckpt: $HOME/runs/midi-rae/dec38_Gqqurn/checkpoints/SwinDecoder_dec38_Gqqurn_best.pt

preencode:
  output_dir: $HOME/datasets/POP909_encoded_exp26
  num_passes: 3

fitpca:
  output_dir: $HOME/datasets/POP909_pca_exp26
  levels: [0, 1, 2, 3, 4, 5]
  n_per_lvl: [0.95, 0.95, 0.95, 0.95, 0.95, 0.95]

flow:
  mode: fine
  pca_dir: $HOME/datasets/POP909_pca_exp26
  encoded_dir: $HOME/datasets/POP909_encoded_exp26
  coarse_ckpt: null
  checkpoint_dir: checkpoints/flow
  checkpoint: ~
  pca_levels: ['L0', 'L1', 'L2']
  fine_levels: [3, 4, 5]

wandb:
  project: ar-mep-swin-midi-rae
  flow_project: midi-rae-flow

encoder_ckpt: $HOME/runs/midi-rae/exp26_z1olvN/checkpoints/SwinEncoder_exp26_z1olvN_best.pt

tag: ???  # required
