defaults:
  - config_swin_razer
  - _self_

# Ablation: max_shift_x=48 (from config_swin base), no factorization loss.
# Isolates the effect of large temporal augmentation from the factorization loss.
# After enc training completes, set encoder_ckpt to the new checkpoint before launching dec.

training:
  lambda_fact: 0.0
  # pca_aug inherits false from config_swin_razer → clean F1 comparison without needing PCA pkl files

encoder_ckpt: $HOME/runs/midi-rae/enc48_kDrJLt/checkpoints/SwinEncoder_enc48_kDrJLt_best.pt

preencode:
  output_dir: $HOME/datasets/POP909_encoded_enc48  # separate from exp26 encoded data
