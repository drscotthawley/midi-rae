data:
  path: ~/datasets/POP909_images_basic
  image_size: 128
  in_channels: 1

model:
  encoder: swin
  patch_h: 4
  patch_w: 4
  embed_dim: 8
  depths: [3, 3, 3, 3, 3, 3]
  num_heads: [2, 2, 2, 4, 8, 16]
  window_size: 4
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  dec_depths: [4, 4, 4, 6, 2, 1]
  dec_num_heads: [2, 2, 2, 4, 8, 16]

training:
  batch_size: 300
  lr: 1e-3
  epochs: 100
  lambd: [0.05, 0.10, 0.15, 0.20, 0.10, 0.05]  # per-level [L0..L5]: strong inversion — minimum at L0
  max_shift_x: 48
  max_shift_y: 12
  lambda_mae: 0.0
  mask_ratio: 0.5
  empty_mask_ratio: 0.05
  ema_eta: 1e-5
  ema_update_every: 1
  lr_warmup_epochs: 24
  lr_tail_epochs: 80
  lambda_mep:  1.0
  lambda_visible: 1.0
  lambda_anchor: 0.0
  lambda_fact: 0.5
  lambda_sim: 1.0
  lambda_sim_curriculum_epochs: 0
  delta_mep: false
  n_skip_finest_levels: 0        # apply LeJEPA to all 6 levels

  dec_batch_size: 360
  dec_epochs: 100
  dec_lr: 2e-3
  pos_weight: 2.5
  gan_warmup: 100000
  enc_ft_lr: -1
  emb_mask_ratio: 0.4
  emb_mask_level_fac: 1.25


preencode:
  output_dir: /home/shawley/datasets/POP909_encoded
  num_passes: 3

flow:
  embedding_glob: /home/shawley/datasets/POP909_pca/train_chunk*_pca20.pt
  checkpoint_dir: checkpoints/flow
  h_dim: 512
  n_layers: 4
  n_epochs: 500
  lr: 1e-3
  batch_size: 4096
  steps_per_epoch: 1000
  warp_s: 0.5
  save_every: 10
  eval_every: 10
  source_df: [null, null, null, 3.0, 3.0, 3.0]
  source_scales: [8.0, 4.0, 2.0, 0.5, 0.1, 0.05]

wandb:
  project: ar-mep-swin-midi-rae
  flow_project: midi-rae-flow

encoder_ckpt: ~/runs/midi-rae/exp9_XZkjbX/checkpoints/SwinEncoder_exp9_XZkjbX_best.pt

tag: ???
