defaults:
  - config_swin
  - _self_

training:
  batch_size: 250
  num_workers: [4, 2]
  dec_batch_size: 600
  use_pitch_mean: true

preencoded: true

encoder_ckpt: $HOME/runs/midi-rae/exp26-wide3/checkpoints/SwinEncoder_exp26-wide3_best.pt

preencode:
  batch_size: 512   # razer has 16 GB RAM; default 1024 causes swap thrashing; 256 uses 6-7 GB, 512 should be fine

flow:
  embedding_glob: $HOME/datasets/POP909_encoded_pca/train_chunk*_pca20.pt  # fit_pca defaults to encoded_dir + _pca
  batch_size: 16384  # razer flow only uses ~8% GPU at default 4096; larger batch = more stable statistics

